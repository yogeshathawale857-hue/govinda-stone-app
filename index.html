<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Govinda Stone Industries — Diesel, Fleet & Sync DPR (v59)</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #0f172a;
    --accent: #ea580c;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 48px; }
  body.portal-active { background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1f2937 100%); min-height: 100vh; }

  /* HEADER WITH 3-DOT MENU */
  .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 12px 14px; position: sticky; top: 0; z-index: 120; box-shadow: 0 4px 14px rgba(15,23,42,0.22); border-bottom: 2px solid var(--accent); }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; max-width: 1180px; margin: 0 auto; position: relative; }
  .brand-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .brand h1 { font-size: 14px; font-weight: 800; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { font-size: 10.5px; color: #cbd5e1; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .sync-badge { font-size: 10.5px; padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,0.1); color: #cbd5e1; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .sync-badge.live { background: rgba(22,163,74,0.25); color: #86efac; border: 1px solid rgba(134,239,172,0.3); }

  /* 3-DOT BUTTON & DROPDOWN */
  .three-dot-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); border: 1px solid #fb923c; color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .admin-dropdown { position: absolute; right: 0; top: 44px; width: 255px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 16px 36px rgba(15,23,42,0.25); z-index: 250; overflow: hidden; }
  .dd-head { background: #f8fafc; padding: 9px 14px; font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .dd-item { width: 100%; background: #fff; border: none; padding: 11px 14px; text-align: left; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dd-item:hover, .dd-item:active { background: #f1f5f9; }
  .dd-sep { height: 1px; background: var(--border); margin: 2px 0; }

  .container { max-width: 1180px; margin: 0 auto; padding: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(15,23,42,0.04); }

  /* CORPORATE LOGIN PORTAL */
  .corp-shell { max-width: 440px; margin: 18px auto; background: #111827; border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.75); overflow: hidden; position: relative; color: #f8fafc; }
  .corp-shell::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #f97316, #3b82f6, #10b981); }
  .corp-head { padding: 26px 22px 18px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .corp-logo { width: 58px; height: 58px; background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 12px; }
  .corp-head h2 { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .corp-head p { font-size: 11.5px; color: #94a3b8; }
  .corp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 9px 6px; }
  .corp-stat-v { font-size: 13.5px; font-weight: 800; color: #fb923c; }
  .corp-stat-l { font-size: 9.5px; color: #94a3b8; margin-top: 2px; text-transform: uppercase; font-weight: 700; }
  .corp-tabs { display: grid; grid-template-columns: 1fr; background: #0b0f19; padding: 6px; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .corp-tab { background: transparent; border: none; padding: 11px; font-size: 12px; font-weight: 800; color: #94a3b8; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .corp-tab.active { background: #1f2937; color: #fff; }
  .corp-body { padding: 22px; }
  .corp-label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
  .corp-input-wrap { position: relative; margin-bottom: 14px; }
  .corp-input-wrap input { width: 100%; background: rgba(15,23,42,0.75); border: 1px solid #334155; padding: 13px 16px; color: #fff; font-size: 15px; font-weight: 700; border-radius: 10px; }
  .corp-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; }
  .corp-btn { width: 100%; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: #fff; border: none; padding: 13px; font-size: 14px; font-weight: 800; border-radius: 10px; cursor: pointer; }
  .corp-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .corp-key { background: rgba(31,41,55,0.7); border: 1px solid #334155; color: #fff; padding: 10px 0; font-size: 16px; font-weight: 800; border-radius: 9px; cursor: pointer; }
  .corp-foot { padding: 13px 20px; background: #0b0f19; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; gap: 8px; flex-wrap: wrap; }
  .status-dot { display: inline-block; width: 7px; height: 7px; background: #10b981; border-radius: 50%; margin-right: 5px; }

  /* SEGMENTED NAVIGATION */
  .seg-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #e2e8f0; padding: 5px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 12px; }
  .seg-btn { border: none; background: transparent; padding: 9px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 800; color: #334155; cursor: pointer; white-space: nowrap; }
  .seg-btn.active { background: var(--primary); color: #fff; }

  /* TOP FILTER ROW */
  .filter-bar-3 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #fff; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  @media(min-width: 720px) { .filter-bar-3 { grid-template-columns: repeat(3, 1fr); } }
  .fb-item { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .fb-item.span2 { grid-column: span 2; }
  @media(min-width: 720px) { .fb-item.span2 { grid-column: span 1; } }
  .fb-lbl { background: #0f172a; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .fb-lbl.orange { background: #ea580c; }
  .fb-item input, .fb-item select { border: none; background: transparent; padding: 7px 9px; font-size: 13px; font-weight: 800; color: var(--primary); }
  .quick-pills { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; padding-top: 2px; }
  .p-pill { border: none; background: #f1f5f9; color: #334155; padding: 5px 10px; border-radius: 7px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .p-pill.active { background: var(--primary); color: #fff; }

  /* STATUS FILTER TABS FOR VEHICLE-WISE AVG TABLE */
  .status-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .sf-tab { border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; padding: 6px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .sf-tab.active-all { background: var(--primary); color: #fff; border-color: var(--primary); }
  .sf-tab.active-extra { background: var(--red); color: #fff; border-color: var(--red); }
  .sf-tab.active-opt { background: var(--green); color: #fff; border-color: var(--green); }

  /* SECTION HEADERS */
  .sec-banner { display: flex; justify-content: space-between; align-items: center; background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 12px 12px 0 0; border-bottom: 2px solid var(--accent); flex-wrap: wrap; gap: 8px; }
  .sec-banner.blue { background: #1e3a8a; border-bottom-color: #3b82f6; }
  .sec-banner.green { background: #065f46; border-bottom-color: #10b981; }
  .sec-banner h2 { font-size: 13.5px; font-weight: 800; letter-spacing: 0.3px; }
  .sec-box { background: #fff; border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; padding: 12px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(15,23,42,0.04); }

  /* 4-POINT DIESEL CARDS */
  .diesel-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  @media(min-width: 720px) { .diesel-grid-4 { grid-template-columns: repeat(4, 1fr); } }
  .dk-card { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--border); background: #f8fafc; }
  .dk-card.c1 { background: #eff6ff; border-color: #bfdbfe; }
  .dk-card.c2 { background: #f0fdf4; border-color: #bbf7d0; }
  .dk-card.c3 { background: #fff7ed; border-color: #fed7aa; }
  .dk-card.c4 { background: #0f172a; border-color: #1e293b; color: #fff; }
  .dk-lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
  .dk-card.c4 .dk-lbl { color: #94a3b8; }
  .dk-val { font-size: 18px; font-weight: 900; margin: 2px 0; color: var(--primary); }
  .dk-card.c1 .dk-val { color: var(--blue); }
  .dk-card.c2 .dk-val { color: var(--green); }
  .dk-card.c3 .dk-val { color: var(--accent); }
  .dk-card.c4 .dk-val { color: #4ade80; }
  .dk-sub { font-size: 10.5px; color: var(--muted); }
  .dk-card.c4 .dk-sub { color: #cbd5e1; }

  .tanker-strip { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; margin-bottom: 6px; font-size: 12px; }
  .tanker-strip.low { background: #fef2f2; border-color: #fca5a5; }

  /* LARGE REMARK TEXTAREA + AUTO OPERATOR TAG */
  .remark-cell { min-width: 185px; white-space: normal; vertical-align: top; }
  .remark-box-lg {
    width: 100%;
    min-width: 175px;
    min-height: 46px;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    background: #fffbeb;
    color: var(--primary);
    resize: vertical;
  }
  .remark-box-lg:focus { background: #fff; border-color: var(--blue); outline: none; }
  .remark-author-tag {
    display: inline-block;
    margin-top: 3px;
    font-size: 10px;
    font-weight: 800;
    color: #15803d;
    background: #dcfce7;
    padding: 1px 6px;
    border-radius: 5px;
  }
  .remark-inp { padding: 5px 7px; font-size: 11.5px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 125px; background: #fffbeb; }
  .remark-inp:focus { background: #fff; border-color: var(--blue); outline: none; }

  /* BUTTONS & INPUTS */
  .btn { border: none; border-radius: 9px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn-primary { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; }
  .btn-dark { background: var(--primary); color: #fff; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-amber { background: #d97706; color: #fff; }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-sm { padding: 6px 10px; font-size: 11.5px; }
  .btn-block { width: 100%; }

  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media(min-width: 720px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .kpi-label { font-size: 10.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
  .kpi-val { font-size: 18px; font-weight: 800; margin: 3px 0; color: var(--primary); }
  .kpi-sub { font-size: 11px; color: var(--muted); }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #334155; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 14px; background: #fff; color: var(--text); }
  input[readonly] { background: #f1f5f9; color: #475569; font-weight: 700; }

  .tabs { display: flex; gap: 5px; margin-bottom: 14px; overflow-x: auto; }
  .tab-btn { flex: 1; background: #e2e8f0; color: #334155; border: none; border-radius: 9px; padding: 10px 4px; font-size: 10.5px; font-weight: 800; cursor: pointer; text-align: center; line-height: 1.25; min-width: 62px; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .hidden { display: none !important; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 700; }
  .badge-orange { background: #ffedd5; color: #9a3412; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-dark { background: #e2e8f0; color: #0f172a; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 7px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: #f8fafc; color: #475569; font-weight: 800; }
  .date-divider td { background: #e2e8f0; color: #0f172a; font-weight: 800; font-size: 11.5px; }

  /* GRAPHS */
  .graph-filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  @media(min-width: 720px) { .graph-filters { grid-template-columns: repeat(4, 1fr); } }
  .gf-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
  .gf-head { background: #ea580c; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; text-align: center; text-transform: uppercase; }
  .gf-head.purple { background: #7c3aed; }
  .gf-head.blue { background: #1d4ed8; }
  .gf-body { padding: 4px 6px; }
  .gf-body input, .gf-body select { border: none; padding: 3px 2px; font-size: 12px; font-weight: 800; text-align: center; background: transparent; }
  .legend-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
  .leg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .col-chart-scroll { overflow-x: auto; padding-bottom: 6px; }
  .col-chart-stage { display: flex; align-items: flex-end; gap: 18px; height: 255px; padding: 42px 14px 10px; border-left: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; background-image: linear-gradient(to top, #e2e8f0 1px, transparent 1px); background-size: 100% 50px; min-width: 100%; width: max-content; }
  .dual-group { display: flex; flex-direction: column; align-items: center; width: 78px; flex-shrink: 0; }
  .dual-bars { display: flex; align-items: flex-end; gap: 4px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; width: 34px; }
  .bar-top-lbl { font-size: 9px; font-weight: 800; margin-bottom: 3px; white-space: nowrap; }
  .extra-pill { font-size: 8.5px; font-weight: 800; padding: 1px 5px; border-radius: 99px; margin-bottom: 3px; white-space: nowrap; }
  .extra-pill.red { background: #fee2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .extra-pill.green { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
  .bar-rect { width: 24px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar-rect.std-blue { background: #3b82f6; }
  .bar-rect.act-red { background: #dc2626; }
  .bar-rect.act-green { background: #16a34a; }
  .bar-rect.cost-green { background: #0f9d58; }
  .bar-rect.work-orange { background: #ea580c; }
  .col-lbl-wrap { height: 54px; display: flex; align-items: flex-start; justify-content: center; margin-top: 6px; }
  .col-lbl { font-size: 10px; font-weight: 700; color: #334155; transform: rotate(-35deg); transform-origin: top right; white-space: nowrap; }

  .elec-hero { background: linear-gradient(135deg, #78350f 0%, #b45309 60%, #d97706 100%); color: #fff; border-radius: 14px; padding: 14px 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .elec-calc-preview { background: #fffbeb; border: 1.5px solid #fcd34d; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

  /* MODALS */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.68); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 14px; backdrop-filter: blur(2px); }
  .modal { background: #fff; border-radius: 16px; max-width: 580px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .alert-banner { background: #fef2f2; border: 2px solid #ef4444; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .req-item { background: #fff; border: 1px solid #fecaca; border-radius: 8px; padding: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 700; z-index: 300; }
  .perm-box { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 12px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
  .perm-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; cursor: pointer; margin: 0; }
  .perm-item input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .veh-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 125px; overflow-y: auto; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
  .v-chip { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; border: 1px solid #cbd5
